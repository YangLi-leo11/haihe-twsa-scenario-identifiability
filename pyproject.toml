[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cee-terrestrial-water-storage"
version = "1.0.0"
description = "Publication code for conditional century-scale terrestrial water-storage analyses"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "matplotlib>=3.9,<3.10",
  "scikit-learn>=1.5,<2",
  "torch>=2.4,<3"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
